name: Verify published terrain app
on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - js/**
      - data/bathymetry/**
      - .github/workflows/verify-pages.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published release and GMRT assets
        run: |
          python - <<'PY'
          import hashlib, json, re, time, urllib.parse, urllib.request
          base = 'https://enou123.github.io/terrain-stereo/'
          cache_key = str(time.time_ns())
          def fetch(path, limit=2_000_000):
              separator = '&' if '?' in path else '?'
              with urllib.request.urlopen(base + path + separator + 'verify=' + cache_key, timeout=30) as response:
                  assert response.status == 200
                  data = response.read(limit + 1)
                  assert len(data) <= limit
                  return data
          for attempt in range(36):
              html = fetch('index.html').decode()
              app_match = re.search(r'<script\b[^>]*\bsrc=["\'](?:\./)?js/app\.js\?v=([^"\']+)', html)
              if 'bathymetry-archipelago' in html and app_match:
                  break
              time.sleep(5)
          else:
              raise AssertionError('GitHub Pages did not serve the terrain app entry point')
          release = app_match.group(1)
          queue = ['js/app.js?v=' + release]
          seen = set()
          while queue:
              path = queue.pop()
              if path in seen:
                  continue
              seen.add(path)
              source = fetch(path).decode()
              imports = re.findall(r"(?:from\s*|import\s*\(\s*)['\"](\./[^'\"]+)['\"]", source)
              for specifier in imports:
                  version = urllib.parse.parse_qs(urllib.parse.urlsplit(specifier).query).get('v', [None])[0]
                  assert version == release, f'{path} imports {specifier} but page advertises {release}'
                  queue.append('js/' + specifier[2:])
          mesh = fetch('js/mesh.js?v=' + release).decode()
          assert 'seabedColorAtDepth' in mesh and 'SEABED_COLOR_STOPS' in mesh
          region_source = fetch('js/bathymetry-regions.js?v=' + release).decode()
          regions = re.findall(r"\{id:'([^']+)'[^}]*?manifest:'([^']+)'", region_source)
          assert regions, 'No bathymetry regions found in the published regional index'
          assert len({region_id for region_id, _ in regions}) == len(regions), 'Duplicate region IDs'
          assert len({manifest for _, manifest in regions}) == len(regions), 'Duplicate region manifests'
          outputs = []
          for region_id, manifest_name in regions:
              assert re.fullmatch(r'[A-Za-z0-9._-]+\.json', manifest_name), f'Invalid manifest path: {manifest_name}'
              manifest = json.loads(fetch('data/bathymetry/' + manifest_name, 16384))
              assert manifest['id'] == region_id, f'{manifest_name} belongs to {manifest.get("id")}, expected {region_id}'
              filename = manifest['file']
              assert re.fullmatch(r'[A-Za-z0-9._-]+\.bin', filename), f'Invalid grid path: {filename}'
              size = manifest['bytes']
              assert isinstance(size, int) and 0 < size <= 16_000_000, f'Unsafe grid size for {region_id}: {size}'
              binary = fetch('data/bathymetry/' + filename, size)
              digest = hashlib.sha256(binary).hexdigest()
              assert len(binary) == size, f'{region_id}: manifest says {size} bytes, got {len(binary)}'
              assert digest == manifest['sha256'], f'{region_id}: SHA-256 mismatch'
              assert manifest['license'] == 'CC BY 4.0'
              outputs.append({'id': region_id, 'manifest': manifest_name, 'bytes': len(binary), 'sha256': digest, 'spacingMeters': manifest['actualSpacingMeters']})
          print(json.dumps({'release': release, 'publicUrl': base, 'http': 200, 'moduleCount': len(seen), 'regionCount': len(outputs), 'bathymetry': outputs}, indent=2))
          PY
