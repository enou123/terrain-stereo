name: Probe official GMRT bathymetry
on:
  push:
    branches: ['codex/bathymetry-gmrt-probe']
    paths: ['.github/workflows/gmrt-probe.yml']
permissions:
  contents: read
jobs:
  download-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install raster reader
        run: python -m pip install --disable-pip-version-check 'rasterio==1.4.3' 'numpy==2.2.6'
      - name: Download bounded official subset and inspect numeric data
        run: |
          mkdir -p bathymetry-probe
          python - <<'PY'
          import urllib.request, urllib.parse, time, json, hashlib, pathlib, datetime
          import numpy as np
          import rasterio
          from rasterio.transform import rowcol
          out=pathlib.Path('bathymetry-probe')
          params=dict(west=139.2,east=140.3,south=32.0,north=32.9,layer='topo',format='geotiff',mresolution=500)
          report={'requestedBounds':params,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':[],'rasters':{},'sources':'https://www.gmrt.org/about/','terms':'https://www.gmrt.org/about/terms_of_use.php','license':'CC BY 4.0','sourceVersion':'To be checked against official metadata; GMRT overview lists v4.5.0, GEBCO 2026 base'}
          for name,endpoint,p in [('topo','GridServer',params),('topo-mask','GridServer',dict(params,layer='topo-mask')),('metadata','GridServer/metadata',dict(params,mformat='json'))]:
              url='https://www.gmrt.org/services/'+endpoint+'?'+urllib.parse.urlencode(p)
              record={'name':name,'url':url};t=time.monotonic()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'terrain-stereo-bathymetry-validation/1.0'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      body=response.read(10*1024*1024+1)
                      if len(body)>10*1024*1024: raise ValueError('Response exceeds the 10 MiB limit')
                      record.update(status=response.status,bytes=len(body),seconds=round(time.monotonic()-t,3),headers=dict(response.headers),sha256=hashlib.sha256(body).hexdigest())
                      path=out/(name+('.tif' if name!='metadata' else '.json'))
                      path.write_bytes(body)
                  if name=='metadata': continue
                  if body[:4] not in [b'II*\x00',b'MM\x00*',b'II+\x00',b'MM\x00+']: raise ValueError('Response is not TIFF')
                  with rasterio.open(path) as src:
                      if src.count!=1 or src.width*src.height>1000000: raise ValueError('Invalid grid dimensions')
                      if src.crs.to_epsg()!=4326: raise ValueError('Expected WGS84 geographic grid')
                      if src.transform.b or src.transform.d: raise ValueError('Rotated grid not supported')
                      values=src.read(1,masked=True).filled(np.nan).astype('<f4')
                      finite=values[np.isfinite(values)];sea=finite[finite<0]
                      sample={}
                      for label,lon,lat in [('aogashima',139.759,32.459),('west-offshore',139.65,32.459),('east-offshore',139.9,32.459)]:
                          row,col=rowcol(src.transform,lon,lat)
                          val=float(values[row,col]);sample[label]=val if np.isfinite(val) else None
                      dx=abs(src.transform.a)*111320*np.cos(np.deg2rad(32.45));dy=abs(src.transform.e)*111320
                      info=dict(width=src.width,height=src.height,crs=str(src.crs),transform=list(src.transform)[:6],bounds=list(src.bounds),nodata=str(src.nodata),validCount=len(finite),seaCount=len(sea),minimum=float(finite.min()) if len(finite) else None,maximum=float(finite.max()) if len(finite) else None,seaMinimum=float(sea.min()) if len(sea) else None,seaMaximum=float(sea.max()) if len(sea) else None,spacingMetersAtCenter=[float(dx),float(dy)],samples=sample)
                      report['rasters'][name]=info
                      if name=='topo':
                          if len(sea)<100 or not (-15000<float(sea.min())<-100): raise ValueError('Bathymetry range check failed')
                          values.tofile(out/'aogashima.f32')
                          descriptor=dict(info,dtype='float32-little-endian',file='aogashima.f32',sourceUrl=url)
                          (out/'aogashima.json').write_text(json.dumps(descriptor,indent=2))
              except Exception as error: record.update(error=str(error),seconds=round(time.monotonic()-t,3))
              report['requests'].append(record)
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if 'topo' not in report['rasters']: raise SystemExit('Official numeric data could not be validated')
          PY
      - name: Save small diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmrt-aogashima-numeric-probe
          path: bathymetry-probe/
          retention-days: 3
          if-no-files-found: error
